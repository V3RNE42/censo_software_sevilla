<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Empresas de desarrollo de software — Sevilla y Málaga</title>
<link rel="stylesheet" href="leaflet.css">
<style>
  :root { --bg:#0f1117; --card:#171a23; --line:#252a36; --txt:#e8eaf0; --dim:#8b93a7;
          --acc:#5b8cff; --ok:#2fbf71; --warn:#e8a33d; --off:#4a5164; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt);
         font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  header.top { padding:28px 20px 18px; border-bottom:1px solid var(--line); }
  h1 { margin:0 0 6px; font-size:22px; }
  .sub { color:var(--dim); font-size:13px; }
  .stats { display:flex; gap:18px; flex-wrap:wrap; margin-top:14px; font-size:13px; }
  .stats b { color:var(--acc); font-size:17px; display:block; }
  #map { height:440px; width:100%; border-bottom:1px solid var(--line); }
  .filtros { display:flex; gap:8px; flex-wrap:wrap; padding:14px 20px; border-bottom:1px solid var(--line); }
  .filtros input, .filtros select { background:var(--card); color:var(--txt); border:1px solid var(--line);
                                     padding:8px 10px; border-radius:8px; font-size:14px; }
  .filtros input { flex:1; min-width:200px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(310px,1fr));
          gap:14px; padding:20px; }
  .ficha { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; }
  .ficha header { display:flex; gap:9px; align-items:baseline; }
  .num { color:var(--dim); font-size:12px; min-width:26px; }
  h3 { margin:0; font-size:15px; line-height:1.3; }
  .tip { color:var(--acc); font-size:12px; margin:6px 0 4px; }
  .dir { color:var(--dim); font-size:12px; margin:0 0 8px; }
  .tel { color:var(--dim); font-size:12px; margin-bottom:8px; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; }
  .chip { font-size:11px; padding:3px 8px; border-radius:99px; border:1px solid var(--line);
          background:#12141c; color:var(--dim); text-decoration:none; }
  .chip.ok { color:var(--ok); border-color:#1d4230; }
  .chip.warn { color:var(--warn); border-color:#453718; }
  .chip.off { color:var(--off); }
  .chip.rate { color:var(--warn); }
  .chip:hover { border-color:var(--acc); color:var(--acc); }
  .chip.off:hover { color:var(--off); border-color:var(--line); }
  details.aviso { padding:20px; color:var(--dim); font-size:13px; border-top:1px solid var(--line); }
  details.aviso pre { white-space:pre-wrap; font-family:inherit; }
  footer { padding:16px 20px 40px; color:var(--off); font-size:12px; }
</style>
</head>
<body>
<header class="top">
  <h1>Empresas de desarrollo de software — Sevilla y Málaga</h1>
  <p class="sub">Censo por triangulación multifuente. Provincias INE 41 y 29.</p>
  <div class="stats" id="stats"></div>
</header>

<div id="map"></div>

<div class="filtros">
  <input id="q" type="search" placeholder="Buscar por nombre o dirección…">
  <select id="prov"><option value="">Todas las provincias</option>
    <option value="SEVILLA">Sevilla</option><option value="MALAGA">Málaga</option></select>
  <select id="act"><option value="">Cualquier actividad</option>
    <option value="RESENA_12M">Reseña &lt;12 meses</option>
    <option value="WEB_VIVA">Solo web viva</option></select>
</div>

<main class="grid" id="grid"><!--FICHAS--></main>

<details class="aviso"><summary>Metodología, fuentes y aviso legal</summary><pre><!--AVISO--></pre></details>
<footer>Generado por <code>scripts/build_html.py</code> desde <code>data/empresas.json</code>. Ficha y mapa salen del mismo registro.</footer>

<script src="leaflet.js"></script>
<script>
const PUNTOS = [/*PUNTOS*/];
const STATS = {{STATS}};

const map = L.map('map').setView([37.15, -5.35], 8);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 18, attribution: '© OpenStreetMap'
}).addTo(map);

const capa = L.layerGroup().addTo(map);
const marcadores = {};

function pinta(puntos) {
  capa.clearLayers();
  puntos.forEach(p => {
    const m = L.circleMarker([p.lat, p.lng], {
      radius: 5, color: p.prov === 'SEVILLA' ? '#5b8cff' : '#2fbf71',
      fillOpacity: .75, weight: 1
    }).bindTooltip(p.name);
    m.on('click', () => {
      const el = document.querySelector(`.ficha[data-n="${p.n}"]`);
      if (el) { el.scrollIntoView({behavior:'smooth', block:'center'}); el.style.borderColor = '#5b8cff'; }
    });
    m.addTo(capa);
    marcadores[p.n] = m;
  });
}

document.getElementById('stats').innerHTML = `
  <div><b>${STATS.total}</b>empresas</div>
  <div><b>${STATS.sevilla}</b>Sevilla</div>
  <div><b>${STATS.malaga}</b>Málaga</div>
  <div><b>${STATS.resena12m}</b>reseña &lt;12m</div>
  <div><b>${STATS.web_viva}</b>web viva</div>
  <div><b>${STATS.con_coords}</b>en el mapa</div>`;

pinta(PUNTOS);

// filtros: ocultan fichas y sincronizan el mapa (mismo criterio, un solo filtro)
const q = document.getElementById('q'), prov = document.getElementById('prov'), act = document.getElementById('act');
function aplica() {
  const texto = q.value.toLowerCase(), p = prov.value, a = act.value;
  let visibles = 0;
  document.querySelectorAll('.ficha').forEach(el => {
    const ok = (!texto || el.textContent.toLowerCase().includes(texto))
            && (!p || el.dataset.prov === p)
            && (!a || el.innerHTML.includes(a === 'RESENA_12M' ? 'reseña' : 'web viva') === (a !== ''));
    el.style.display = ok ? '' : 'none';
    if (ok) visibles++;
  });
  const ids = new Set([...document.querySelectorAll('.ficha')]
    .filter(el => el.style.display !== 'none')
    .map(el => +el.querySelector('.num').textContent));
  pinta(PUNTOS.filter(x => ids.has(x.n)));
  document.getElementById('grid').dataset.visibles = visibles;
}
[q, prov, act].forEach(el => el.addEventListener('input', aplica));
</script>
</body>
</html>
