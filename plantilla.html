<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Empresas de desarrollo de software — Sevilla y Málaga</title>
<link rel="stylesheet" href="leaflet.css">
<style>
  :root { --bg:#0f1117; --card:#171a23; --line:#252a36; --txt:#e8eaf0; --dim:#8b93a7;
          --acc:#5b8cff; --ok:#2fbf71; --warn:#e8a33d; --off:#4a5164; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt);
         font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  header.top { padding:28px 20px 18px; border-bottom:1px solid var(--line); }
  h1 { margin:0 0 6px; font-size:22px; }
  .sub { color:var(--dim); font-size:13px; }
  .stats { display:flex; gap:18px; flex-wrap:wrap; margin-top:14px; font-size:13px; }
  .stats b { color:var(--acc); font-size:17px; display:block; }
  #map { height:440px; width:100%; border-bottom:1px solid var(--line); }
  .filtros { display:flex; gap:8px; flex-wrap:wrap; padding:14px 20px; border-bottom:1px solid var(--line); }
  .filtros input, .filtros select { background:var(--card); color:var(--txt); border:1px solid var(--line);
                                     padding:8px 10px; border-radius:8px; font-size:14px; }
  .filtros input { flex:1; min-width:200px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(310px,1fr));
          gap:14px; padding:20px; }
  .ficha { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; }
  .ficha header { display:flex; gap:9px; align-items:baseline; }
  .num { color:var(--dim); font-size:12px; min-width:26px; }
  h3 { margin:0; font-size:15px; line-height:1.3; }
  .dir { color:var(--dim); font-size:12px; margin:6px 0 8px; }
  .tel { color:var(--dim); font-size:12px; margin-bottom:8px; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; }
  .chip { font-size:11px; padding:3px 8px; border-radius:99px; border:1px solid var(--line);
          background:#12141c; color:var(--dim); text-decoration:none; }
  .chip.off { color:var(--off); }
  .chip:hover { border-color:var(--acc); color:var(--acc); }
  .chip.off:hover { color:var(--off); border-color:var(--line); }
  details.aviso { padding:20px; color:var(--dim); font-size:13px; border-top:1px solid var(--line); }
  details.aviso pre { white-space:pre-wrap; font-family:inherit; }
  footer { padding:16px 20px 40px; color:var(--off); font-size:12px; }

  /* ---- botón Imprimir etiquetas (arriba a la derecha) ---- */
  header.top { position:relative; }
  .btn-etq { position:absolute; top:24px; right:20px;
             background:var(--acc); color:#0f1117; border:0; border-radius:9px;
             padding:10px 16px; font:600 14px/1 inherit; cursor:pointer; }
  .btn-etq:hover { background:#7ba3ff; }
  .btn-etq:focus-visible { outline:2px solid #fff; outline-offset:2px; }

  /* ---- modal de etiquetas ---- */
  dialog#etq { width:min(100%,240mm); max-height:92vh; padding:0; border:1px solid var(--line);
               border-radius:12px; background:var(--bg); color:var(--txt); }
  dialog#etq::backdrop { background:rgba(0,0,0,.7); }
  .etq-bar { position:sticky; top:0; z-index:2; display:flex; gap:10px; align-items:center;
             padding:12px 16px; background:var(--card); border-bottom:1px solid var(--line); }
  .etq-bar h2 { margin:0; font-size:16px; flex:1; }
  .etq-bar button { background:var(--acc); color:#0f1117; border:0; border-radius:8px;
                    padding:9px 14px; font:600 13px/1 inherit; cursor:pointer; }
  .etq-bar button.sec { background:var(--card); color:var(--txt); border:1px solid var(--line); }
  .etq-count { color:var(--dim); font-size:12px; }
  /* leyenda del mapa (control de Leaflet) */
  .leyenda { background:rgba(23,26,35,.92); border:1px solid var(--line); border-radius:8px;
             padding:8px 10px; font-size:12px; color:var(--txt); display:flex; gap:14px;
             line-height:1.6; }
  .leyenda span { display:flex; align-items:center; gap:6px; }
  .leyenda i { width:10px; height:10px; border-radius:50%; display:inline-block; }

  .hoja { padding:16px; background:#fff; }
  /* grid tambien en pantalla: la vista previa debe verse COMO la hoja A4.
     (Antes el grid vivia solo en @media print y la previsualizacion salia
     apilada en una columna, sin parecerse al PDF.) */
  .hoja { display:grid; grid-template-columns:repeat(2,88mm);
          grid-auto-rows:52mm; gap:0; align-content:start; }
  .etq { width:88mm; height:52mm; box-sizing:border-box; padding:6mm; overflow:hidden;
         border:1px dashed #c9ced9; display:flex; flex-direction:column; justify-content:center; }
  .etq-emp { font-weight:700; font-size:11pt; color:#111; text-transform:uppercase;
             line-height:1.2; margin-bottom:2.5mm; }
  .etq-dir { font-size:9.5pt; color:#333; line-height:1.35; }
  .etq-loc { font-size:9.5pt; color:#333; line-height:1.35; margin-top:1mm; }

  /* ---- A4: 2 columnas x 5 filas = 10 etiquetas por pagina ---- */
  @page { size:A4 portrait; margin:8mm; }
  @media print {
    body { background:#fff; color:#000; }
    header.top, #map, .filtros, main.grid, details.aviso, footer, .etq-bar { display:none !important; }
    dialog#etq { position:static; width:auto; max-height:none; border:0; border-radius:0;
                 background:#fff; padding:0; margin:0; }
    dialog#etq::backdrop { display:none; }
    .hoja { padding:0; display:grid;
            grid-template-columns:repeat(2,88mm);
            grid-auto-rows:52mm; gap:0; }
    .etq { border:0; outline:1px dashed #d5d9e0; break-inside:avoid; page-break-inside:avoid; }
  }
</style>
</head>
<body>
<header class="top">
  <h1>Empresas de desarrollo de software — Sevilla y Málaga</h1>
  <p class="sub">Censo por triangulación multifuente. Provincias INE 41 y 29.</p>
  <button class="btn-etq" id="btn-etq" type="button">Imprimir etiquetas</button>
  <div class="stats" id="stats"></div>
</header>

<div id="map"></div>

<div class="filtros">
  <input id="q" type="search" placeholder="Buscar por nombre o dirección…">
  <select id="prov"><option value="">Todas las provincias</option>
    <option value="SEVILLA">Sevilla</option><option value="MALAGA">Málaga</option></select>
</div>

<main class="grid" id="grid"><!--FICHAS--></main>

<details class="aviso"><summary>Metodología, fuentes y aviso legal</summary><pre><!--AVISO--></pre></details>
<footer>Generado por <code>scripts/build_html.py</code> desde <code>data/empresas.json</code>. Ficha y mapa salen del mismo registro.</footer>

<dialog id="etq">
  <div class="etq-bar">
    <h2>Etiquetas postales</h2>
    <span class="etq-count" id="etq-count"></span>
    <button type="button" id="etq-print">Imprimir / PDF</button>
    <button type="button" class="sec" id="etq-close">Cerrar</button>
  </div>
  <div class="hoja" id="hoja"><!--ETIQUETAS--></div>
</dialog>

<script src="leaflet.js"></script>
<script>
const PUNTOS = [/*PUNTOS*/];
const STATS = {{STATS}};

const map = L.map('map').setView([37.15, -5.35], 8);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 18, attribution: '© OpenStreetMap'
}).addTo(map);

const capa = L.layerGroup().addTo(map);
const marcadores = {};

// leyenda: el mapa codifica la provincia en el color del marcador, hay que decirlo.
const COLORES = { SEVILLA: '#5b8cff', MALAGA: '#2fbf71' };
const NOMBRES = { SEVILLA: 'Sevilla', MALAGA: 'Málaga' };

// L.Control.extend, no `L.control().onAdd = fn`: esa forma le asigna onAdd a un
// objeto temporal y addControl recibe otro SIN onAdd -> TypeError y el script
// entero muere ahi (0 marcadores, 0 leyenda). Medido.
const Leyenda = L.Control.extend({
  onAdd: function () {
    const d = L.DomUtil.create('div', 'leyenda');
    d.innerHTML = Object.keys(COLORES).map(k =>
      `<span><i style="background:${COLORES[k]}"></i>${NOMBRES[k]}</span>`).join('');
    return d;
  }
});

function pinta(puntos) {
  capa.clearLayers();
  puntos.forEach(p => {
    const m = L.circleMarker([p.lat, p.lng], {
      radius: 5, color: COLORES[p.prov] || '#8b93a7',
      fillOpacity: .75, weight: 1
    }).bindTooltip(p.name);
    m.on('click', () => {
      const el = document.querySelector(`.ficha[data-n="${p.n}"]`);
      if (el) { el.scrollIntoView({behavior:'smooth', block:'center'}); el.style.borderColor = '#5b8cff'; }
    });
    m.addTo(capa);
    marcadores[p.n] = m;
  });
}

document.getElementById('stats').innerHTML = `
  <div><b>${STATS.total}</b>empresas</div>
  <div><b>${STATS.sevilla}</b>Sevilla</div>
  <div><b>${STATS.malaga}</b>Málaga</div>
  <div><b>${STATS.con_coords}</b>en el mapa</div>`;

pinta(PUNTOS);
new Leyenda({ position: 'bottomright' }).addTo(map);

// filtros: ocultan fichas y sincronizan el mapa (mismo criterio, un solo filtro)
const q = document.getElementById('q'), prov = document.getElementById('prov');
function aplica() {
  const texto = q.value.toLowerCase(), p = prov.value;
  let visibles = 0;
  document.querySelectorAll('.ficha').forEach(el => {
    const ok = (!texto || el.textContent.toLowerCase().includes(texto))
            && (!p || el.dataset.prov === p);
    el.style.display = ok ? '' : 'none';
    if (ok) visibles++;
  });
  const ids = new Set([...document.querySelectorAll('.ficha')]
    .filter(el => el.style.display !== 'none')
    .map(el => +el.querySelector('.num').textContent));
  pinta(PUNTOS.filter(x => ids.has(x.n)));
  document.getElementById('grid').dataset.visibles = visibles;
}
[q, prov].forEach(el => el.addEventListener('input', aplica));

// ---- etiquetas postales: el <dialog> nativo ya da modal, foco y Escape ----
const dlg = document.getElementById('etq');
document.getElementById('btn-etq').addEventListener('click', () => {
  dlg.showModal();
  const n = document.querySelectorAll('#hoja .etq').length;
  document.getElementById('etq-count').textContent =
    `${n} etiquetas · ${Math.ceil(n / 10)} páginas A4`;
});
document.getElementById('etq-close').addEventListener('click', () => dlg.close());
document.getElementById('etq-print').addEventListener('click', () => window.print());

</script>
</body>
</html>
